[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "law-radar"
version = "0.1.0"
description = "Reads official journals every week and flags new laws that affect your ICP, with cited facts and list recipes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Optional: only for API mode. The default path (--no-ai plus /digest in Claude Code) doesn't need it.
api = ["anthropic>=0.116"]
dev = ["pytest>=8"]

[project.scripts]
law-radar = "law_radar.cli:main"

[tool.setuptools.packages.find]
include = ["law_radar*"]

[tool.setuptools.package-data]
law_radar = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
