# Public datasets that list recipes may use. ICP-neutral: datasets, not customers.
#
# Every entry records what was checked and against what. A recipe that needs a dataset
# outside this file is published with "unverified dataset".
#
# Only add a dataset after checking its publisher, access method and licence at the source.

- id: fr_france_travail_offres
  market: FR
  name: France Travail job ads API (Offres d'emploi v2)
  publisher: France Travail
  url: https://francetravail.io/data/api/offres-emploi
  access: REST API, free registration on francetravail.io, OAuth client credentials
  licence: Licence Ouverte 2.0
  names_companies: true
  timing: Live job ads, updated continuously
  fields: [intitule, dateCreation, entreprise, codeNAF, secteurActiviteLibelle, trancheEffectifEtab, salaire, lieuTravail, typeContrat]
  notes: Search results are paged at 150 per page. Rate limit 10 calls per second.
  verified_on: "2026-09-24"
  verified: >-
    Publisher, access, licence and the 10 calls/second limit from the data.gouv.fr API page.
    Field names from published client code, not yet from a live call.

- id: fr_sirene
  market: FR
  name: SIRENE register of companies and establishments
  publisher: INSEE
  url: https://www.data.gouv.fr/fr/datasets/base-sirene-des-entreprises-et-de-leurs-etablissements-siren-siret/
  access: Monthly bulk files (ZIP, Parquet); API through INSEE's portal with an account
  licence: Licence Ouverte 2.0
  names_companies: true
  timing: Monthly stock files, with API updates in between
  fields: [siren, siret, denomination, activitePrincipale (NAF), trancheEffectifs]
  notes: Includes sole traders' personal data. Use company-level fields only.
  verified_on: "2026-09-24"
  verified: >-
    Publisher, licence, update cadence and the NAF activity code from the data.gouv.fr dataset page.
    The employee size band field name is from INSEE's schema, not checked on that page.

- id: es_bdns_concesiones
  market: ES
  name: BDNS grants awarded (concesiones), companies only
  publisher: Intervención General de la Administración del Estado (SNPSAP)
  url: https://www.infosubvenciones.es/bdnstrans/GE/es/concesiones
  access: REST API, no key (/bdnstrans/api/concesiones/busqueda), filters by award date, call text and call number; `law-radar bdns` exports company rows as CSV
  licence: SNPSAP reuse conditions. Commercial reuse allowed. Data about individuals only for scrutiny of public administration, so law-radar drops individuals
  names_companies: true
  timing: Daily; awards stay published for 4 years
  fields: [beneficiario (tax ID and company name), fechaConcesion, importe, instrumento, convocatoria, numeroConvocatoria, nivel1, nivel2, nivel3]
  notes: No sector code and no company size. Individuals appear with a masked ID and their name; law-radar keeps legal-entity tax IDs only. Attribution - Origen de los datos, Intervención General de la Administración del Estado.
  verified_on: "2026-09-28"
  verified: >-
    Field names and filters from live API calls on 28 September 2026. Reuse conditions read on the SNPSAP legal notice (avisolegal).
    The masked format for individuals seen on live records.
