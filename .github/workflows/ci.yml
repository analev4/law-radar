name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Model calls are replayed from tests/fixtures/recorded. No API key, no network for the model.
      - run: pytest -q
        env:
          LAW_RADAR_REQUIRE_RECORDINGS: "1"
